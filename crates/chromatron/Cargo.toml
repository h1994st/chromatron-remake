[package]
name = "chromatron"
description = "Chromatron for macOS: window, menus, input, text and saves around the lumen engine"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
env_logger = { version = "=0.11.11", default-features = false }
log = "=0.4.34"
lumen = { path = "../lumen" }
muda = "=0.21.1"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFAttributedString", "CFCGTypes", "CFDictionary", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPath"] }
objc2-core-text = { version = "=0.3.2", default-features = false, features = ["std", "CTFont", "CTFrame", "CTFramesetter", "CTStringAttributes", "objc2-core-graphics"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSBundle", "NSString", "NSUserDefaults"] }
png = "=0.18.1"
softbuffer = "=0.4.8"
spectrograph = { path = "../spectrograph", default-features = false }
winit = "=0.30.13"

[build-dependencies]
spectrograph = { path = "../spectrograph", default-features = false, features = ["decode"] }

[dev-dependencies]
spectrograph = { path = "../spectrograph", default-features = false, features = ["decode"] }
tempfile = "=3.27.0"
