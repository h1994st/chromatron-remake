[package]
name = "chromatron-web"
description = "Chromatron in the browser: the lumen engine and all four games behind a wasm-bindgen session"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lumen = { path = "../lumen" }
spectrograph = { path = "../spectrograph", default-features = false }
# Must equal the wasm-bindgen CLI version (`just wasm-bindgen-version`, the Pages workflow).
wasm-bindgen = "=0.2.129"

[build-dependencies]
spectrograph = { path = "../spectrograph", default-features = false, features = ["decode"] }

[dev-dependencies]
spectrograph = { path = "../spectrograph", default-features = false, features = ["decode"] }
