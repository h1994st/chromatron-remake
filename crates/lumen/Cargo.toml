[package]
name = "lumen"
description = "Chromatron engine: board model, beam tracer, rules, input and software renderer"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# Off by default, so a crate that depends on lumen never links the decoder or PNG writer.
default = []
# The `lumen` command-line tool (`lumen shot`), which decodes the originals and writes PNGs.
cli = ["spectrograph/cli"]

[dependencies]
spectrograph = { path = "../spectrograph", default-features = false }

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
spectrograph = { path = "../spectrograph", default-features = false, features = ["decode"] }

[[bin]]
name = "lumen"
required-features = ["cli"]

[[bench]]
name = "engine"
harness = false
