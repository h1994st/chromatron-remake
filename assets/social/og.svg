<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Our own artwork for the site's social preview (no game data): `just social-images` renders it to web/og.png. -->
  <defs>
    <radialGradient id="sky" cx="757.5" cy="337.5" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d1846"/>
      <stop offset="0.42" stop-color="#0d0d26"/>
      <stop offset="1" stop-color="#05050d"/>
    </radialGradient>
    <pattern id="tiles" width="45" height="45" patternUnits="userSpaceOnUse" x="15" y="0">
      <rect x="2.5" y="2.5" width="40" height="40" rx="5" fill="#b8c0ff" fill-opacity="0.025" stroke="#b8c0ff" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="tile-fade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="tile-mask"><rect width="1200" height="630" fill="url(#tile-fade)"/></mask>
    <filter id="halo" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="1030"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="spill" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="1030"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="1030"><feGaussianBlur stdDeviation="3"/></filter>
    <radialGradient id="bloom">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.18" stop-color="#e9ecff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#8f8cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a9b0cc"/>
      <stop offset="1" stop-color="#4c516b"/>
    </linearGradient>
    <!-- One beam: a wide halo, a tight glow and a bright core, added onto what is beneath. -->
    <g id="beams-red" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1210 337.5H982.5"/>
      <path d="M1210 427.5H1072.5L982.5 517.5H757.5"/>
    </g>
    <g id="beams-green" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1095 0 982.5 112.5V337.5"/>
      <path d="M982.5 112.5H757.5"/>
    </g>
    <g id="beams-blue" fill="none" stroke-linecap="round">
      <path d="M757.5 -10V112.5"/>
      <path d="M757.5 640V517.5"/>
    </g>
    <path id="beam-yellow" d="M982.5 337.5H757.5"/>
    <path id="beam-cyan" d="M757.5 112.5V337.5"/>
    <path id="beam-magenta" d="M757.5 517.5V337.5"/>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#tiles)" mask="url(#tile-mask)"/>

  <g style="mix-blend-mode: screen" fill="none" stroke-linecap="round">
    <g filter="url(#spill)" stroke-width="60" stroke-opacity="0.22">
      <use href="#beams-red" stroke="#ff2945"/>
      <use href="#beams-green" stroke="#1fff7c"/>
      <use href="#beams-blue" stroke="#2456ff"/>
      <use href="#beam-yellow" stroke="#ffd21f"/>
      <use href="#beam-cyan" stroke="#28f0ff"/>
      <use href="#beam-magenta" stroke="#ff3cf0"/>
    </g>
    <g filter="url(#halo)" stroke-width="28" stroke-opacity="0.7">
      <use href="#beams-red" stroke="#ff2945"/>
      <use href="#beams-green" stroke="#1fff7c"/>
      <use href="#beams-blue" stroke="#2456ff"/>
      <use href="#beam-yellow" stroke="#ffd21f" stroke-opacity="1" stroke-width="34"/>
      <use href="#beam-cyan" stroke="#28f0ff" stroke-width="32"/>
      <use href="#beam-magenta" stroke="#ff3cf0" stroke-width="32"/>
    </g>
    <g filter="url(#soft)" stroke-width="9">
      <use href="#beams-red" stroke="#ff2945"/>
      <use href="#beams-green" stroke="#1fff7c"/>
      <use href="#beams-blue" stroke="#3567ff"/>
      <use href="#beam-yellow" stroke="#ffd21f" stroke-width="11"/>
      <use href="#beam-cyan" stroke="#28f0ff" stroke-width="11"/>
      <use href="#beam-magenta" stroke="#ff3cf0" stroke-width="11"/>
    </g>
    <g stroke-width="3">
      <use href="#beams-red" stroke="#ffd6dc"/>
      <use href="#beams-green" stroke="#e0ffec"/>
      <use href="#beams-blue" stroke="#d6e0ff"/>
      <use href="#beam-yellow" stroke="#fffbe6" stroke-width="4"/>
      <use href="#beam-cyan" stroke="#e6fdff" stroke-width="4"/>
      <use href="#beam-magenta" stroke="#ffe3fc" stroke-width="4"/>
    </g>
  </g>

  <!-- Mirrors: polished bars. -->
  <g fill="url(#silver)">
    <rect x="-19" y="-3.5" width="38" height="7" rx="3.5" transform="translate(1072.5 427.5) rotate(-22.5)"/>
    <rect x="-19" y="-3.5" width="38" height="7" rx="3.5" transform="translate(982.5 517.5) rotate(-22.5)"/>
  </g>
  <!-- Combiners: glass panes that join two beams into one. -->
  <g fill="#e8ecff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5">
    <rect x="-20" y="-4" width="40" height="8" rx="2" transform="translate(982.5 337.5) rotate(-45)"/>
    <rect x="-20" y="-4" width="40" height="8" rx="2" transform="translate(757.5 112.5) rotate(-45)"/>
    <rect x="-20" y="-4" width="40" height="8" rx="2" transform="translate(757.5 517.5) rotate(45)"/>
    <rect x="-12" y="-12" width="24" height="24" rx="3" transform="translate(982.5 112.5) rotate(45)"/>
  </g>

  <!-- The lit target, where the three mixed beams make white. -->
  <g transform="translate(757.5 337.5)">
    <circle r="190" fill="url(#bloom)" style="mix-blend-mode: screen"/>
    <g fill="none" stroke-width="2" style="mix-blend-mode: screen">
      <circle cx="-1.6" cy="1" r="30" stroke="#ff3cf0"/>
      <circle cx="1.6" cy="1" r="30" stroke="#ffd21f"/>
      <circle cy="-1.8" r="30" stroke="#28f0ff"/>
    </g>
    <circle r="30" fill="none" stroke="#ffffff" stroke-width="2.5" filter="url(#soft)"/>
    <circle r="30" fill="none" stroke="#ffffff" stroke-width="1.6"/>
    <circle r="20" fill="#0a0a1e" fill-opacity="0.6"/>
    <circle r="14" fill="#ffffff" filter="url(#soft)"/>
    <circle r="11" fill="#ffffff"/>
  </g>
  <!-- An unlit target, still waiting for its beam. -->
  <g transform="translate(1072.5 562.5)" fill="none" stroke="#b8c0ff" stroke-opacity="0.35" stroke-width="1.6">
    <circle r="16"/>
    <circle r="6" fill="#b8c0ff" fill-opacity="0.12"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <g font-size="104" font-weight="800" letter-spacing="-3">
      <text x="78" y="372" fill="#ff2945" fill-opacity="0.85" style="mix-blend-mode: screen">Chromatron</text>
      <text x="82" y="372" fill="#2f9bff" fill-opacity="0.85" style="mix-blend-mode: screen">Chromatron</text>
      <text x="80" y="372" fill="#f6f7ff">Chromatron</text>
    </g>
    <text x="82" y="430" font-size="34" font-weight="500" fill="#b9bedb">Laser puzzles 1–4, in your browser</text>
    <text x="82" y="562" font-size="22" font-weight="500" fill="#7c83a6" letter-spacing="0.3">shengtuo.me/chromatron-remake</text>
  </g>
</svg>
